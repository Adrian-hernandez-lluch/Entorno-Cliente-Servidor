<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Botón de cambiar Tema</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="fondo">
<button id="botonTema">Cambiar Tema</button>
<script src="index.js">
    const botonTema=document.getElementById('botonTema');
    document.body.className=localStorage.getItem("tema");

    botonTema.addEventListener("click",()=>{
        document.body.className=localStorage.getItem("tema")

    })
</script>
</body>
</html>
